<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="description" content="Pramod Gobburi — Full-Stack Software Engineer. Portfolio, experience, and projects." />

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pramod Gobburi — Full-Stack Software Engineer" />
  <meta property="og:description" content="Full-stack software engineer building reliable, end-to-end systems." />
  <meta property="og:url" content="https://pramodgobburi.com" />
  <meta name="twitter:card" content="summary" />

  <title>Pramod Gobburi — Software Engineer</title>
  <link rel="shortcut icon" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Devicon (tech logos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#top" data-brand>PG</a>
    <nav class="nav__links" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#work">Experience</a>
      <a href="#education">Education</a>
      <a href="#projects">Projects</a>
    </nav>
    <a class="btn btn--ghost nav__resume" data-resume target="_blank" rel="noopener">Resume</a>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero__content">
        <p class="hero__eyebrow"><span class="dot"></span> <span data-availability>Software Engineer</span></p>
        <h1 class="hero__name" data-name>—</h1>
        <p class="hero__title" data-title>—</p>
        <p class="hero__tagline" data-tagline></p>
        <div class="hero__actions">
          <a class="btn btn--primary" data-resume target="_blank" rel="noopener">Resume →</a>
        </div>
        <div class="hero__socials" data-socials></div>
      </div>
      <div class="hero__3d" id="hero-3d" aria-hidden="true">
        <canvas id="hero-canvas"></canvas>
      </div>
    </section>

    <!-- About + Skills -->
    <section class="section" id="about">
      <div class="section__head">
        <span class="section__index">01</span>
        <h2 class="section__title" data-about-heading>About</h2>
      </div>
      <div class="about">
        <div class="about__body" data-about-body></div>
        <aside class="about__skills">
          <h3 class="about__skills-title">Stack</h3>
          <ul class="skills" data-skills></ul>
        </aside>
      </div>
    </section>

    <!-- Experience -->
    <section class="section" id="work">
      <div class="section__head">
        <span class="section__index">02</span>
        <h2 class="section__title">Experience</h2>
      </div>
      <ol class="timeline" data-experience></ol>
    </section>

    <!-- Education -->
    <section class="section" id="education">
      <div class="section__head">
        <span class="section__index">03</span>
        <h2 class="section__title">Education</h2>
      </div>
      <div class="education" data-education></div>
    </section>

    <!-- Projects -->
    <section class="section" id="projects">
      <div class="section__head">
        <span class="section__index">04</span>
        <h2 class="section__title">Projects</h2>
      </div>
      <div class="projects" data-projects></div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__name" data-footer-name>Pramod Gobburi</p>
    <div class="footer__socials" data-socials></div>
    <p class="footer__meta"><span id="year"></span></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/app.js"></script>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/" } }</script>
  <script type="module" src="assets/js/three-hero.js"></script>
</body>
</html>
